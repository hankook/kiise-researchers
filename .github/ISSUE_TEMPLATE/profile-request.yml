name: 프로필 등록 · 수정 요청
description: GitHub 계정이 있는 분을 위한 등록 경로입니다. (구글 폼으로 제출하셔도 됩니다)
title: "[프로필] 성명 / 소속"
labels: ["프로필요청", "검토대기"]
body:
  - type: markdown
    attributes:
      value: |
        신진연구자 프로필 브로셔 등록 요청입니다.
        **사진 파일은 이슈에 끌어다 놓으면 업로드됩니다.**
        작성해 주신 내용은 담당자 검토 후 게시되며, 보통 1~2주가 소요됩니다.

        > ⚠ 이슈는 **누구나 볼 수 있는 공개 글**입니다. 공개를 원하지 않는 연락처는
        > 적지 마시고, 구글 폼 경로를 이용해 주세요.

  - type: dropdown
    id: kind
    attributes:
      label: 요청 종류
      options: ["신규 등록", "내용 수정", "게시 중단(삭제)"]
    validations: { required: true }

  - type: input
    id: name
    attributes: { label: 성명(국문), placeholder: 김정보 }
    validations: { required: true }

  - type: input
    id: nameEn
    attributes: { label: 성명(영문), placeholder: Jeongbo Kim }
    validations: { required: true }

  - type: input
    id: affiliation
    attributes: { label: 소속 기관 / 학과 / 직위, placeholder: ○○대학교 컴퓨터공학과 조교수 }
    validations: { required: true }

  - type: input
    id: degree
    attributes: { label: 최종 학위, placeholder: ○○대학교 공학박사 (인공지능) }
    validations: { required: true }

  - type: input
    id: appointedAt
    attributes: { label: 최초 임용일, placeholder: 2024-03 }
    validations: { required: true }

  - type: input
    id: contact
    attributes:
      label: 공개용 E-mail / 연구실 홈페이지
      placeholder: abcde123@xxx.ac.kr / https://...
    validations: { required: true }

  - type: input
    id: keywords
    attributes:
      label: 연구 키워드 (쉼표로 구분, 5~10개)
      placeholder: 기계학습, 표현학습, 자기지도학습, 멀티모달, 신뢰가능 AI
    validations: { required: true }

  - type: input
    id: societies
    attributes:
      label: 정보과학회 소사이어티 · 연구회 (쉼표로 구분)
      placeholder: 인공지능 소사이어티, 컴퓨터비전 및 패턴인식 연구회
    validations: { required: false }

  - type: input
    id: conferences
    attributes:
      label: 주로 참석하는 학회 (쉼표로 구분)
      placeholder: NeurIPS, ICML, 한국소프트웨어종합학술대회(KSC)
    validations: { required: false }

  - type: textarea
    id: message
    attributes:
      label: 한마디 (120자 이내)
      placeholder: 동료 연구자들께 전하고 싶은 한 문장
    validations: { required: false }

  - type: textarea
    id: career
    attributes: { label: 주요 경력 (한 줄에 하나) }
    validations: { required: true }

  - type: textarea
    id: achievements
    attributes: { label: 대표 논문 및 수행과제 (한 줄에 하나) }
    validations: { required: true }

  - type: textarea
    id: goals
    attributes: { label: 연구목표 (한 줄에 하나) }
    validations: { required: true }

  - type: textarea
    id: research
    attributes: { label: 연구내용 (한 줄이 한 문단) }
    validations: { required: true }

  - type: textarea
    id: collaboration
    attributes: { label: 공동연구 희망분야 (한 줄에 하나) }
    validations: { required: true }

  - type: textarea
    id: files
    attributes:
      label: 사진 / 연구내용 그림
      description: 이 칸에 파일을 끌어다 놓아 주세요. 사진은 세로 3:4 비율을 권장합니다.
    validations: { required: false }

  - type: checkboxes
    id: consent
    attributes:
      label: 확인 사항
      options:
        - label: 위 내용을 한국정보과학회 신진연구자 프로필 브로셔에 공개하는 데 동의합니다.
          required: true
        - label: 본인이 작성한 내용이며, 사실과 다른 내용이 없음을 확인합니다.
          required: true
